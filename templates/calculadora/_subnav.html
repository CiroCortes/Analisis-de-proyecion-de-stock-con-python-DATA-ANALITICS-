{# Subnavegacion de la Calculadora de Compras. Uso: {% include 'calculadora/_subnav.html' %} #}
{% with n=request.resolver_match.url_name %}
<nav class="bg-white rounded-2xl border border-slate-200 shadow-sm px-2 py-2 flex flex-wrap gap-1 text-[11px] font-bold uppercase tracking-wider">
    {% for nombre, etiqueta, icono, activos in calc_subnav %}
    <a href="{% url 'calculadora:'|add:nombre %}"
       class="px-3 py-2 rounded-xl transition flex items-center gap-1.5 {% if n in activos %}bg-pesco-cyan text-white shadow-sm{% else %}text-slate-600 hover:bg-pesco-lightcyan hover:text-pesco-cyan{% endif %}">
        <i class="fa-solid {{ icono }}"></i> {{ etiqueta }}
    </a>
    {% endfor %}
</nav>
{% endwith %}
