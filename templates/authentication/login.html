{% extends 'base.html' %}

{% block title %}Iniciar Sesión | Pesco S.A. S&OP{% endblock %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
        <div class="bg-pesco-dark p-8 text-center border-b-4 border-pesco-cyan">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-pesco-cyan text-white text-2xl font-black rounded-full mb-3 shadow-lg">
                <i class="fa-solid fa-truck-monster"></i>
            </div>
            <h2 class="text-2xl font-black text-white tracking-wide">PESCO S.A.</h2>
            <p class="text-xs font-bold text-pesco-cyan tracking-widest uppercase mt-0.5">VAMOS CONTIGO</p>
        </div>

        <div class="p-8 space-y-6">
            <div class="text-center">
                <h3 class="text-lg font-bold text-slate-900">Acceso Plataforma S&OP</h3>
                <p class="text-xs text-slate-500">Ingresa tus credenciales corporativas para continuar</p>
            </div>

            <form method="POST" action="{% url 'authentication:login' %}" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5" for="id_username">
                        Usuario Corporativo
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="username" id="id_username" required
                               class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pesco-cyan focus:bg-white transition"
                               placeholder="Ingrese su usuario">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5" for="id_password">
                        Contraseña
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" id="id_password" required
                               class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pesco-cyan focus:bg-white transition"
                               placeholder="••••••••">
                    </div>
                </div>

                <button type="submit"
                        class="w-full bg-pesco-cyan hover:bg-pesco-darkcyan text-white font-bold py-3.5 rounded-full shadow-lg hover:shadow-cyan-500/20 transition duration-200 flex justify-center items-center gap-2 uppercase tracking-wider text-xs">
                    <i class="fa-solid fa-right-to-bracket"></i> Ingresar al Sistema
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
